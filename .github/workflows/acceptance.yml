name: Live acceptance sweep

on:
  schedule:
    # Avoid the top of the hour, when scheduled Actions are most likely to queue.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      tenant_slugs:
        description: Space- or comma-separated tenant slugs (optional override)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-acceptance-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Check live public endpoints
    # Only meaningful against a deployment this repository owns. The same
    # guard deploy.yml applies to its Cloudflare credentials: with nothing
    # configured, skip quietly instead of failing on every schedule. A manual
    # run is always allowed, so the check can be exercised deliberately.
    if: vars.CORPUSKIT_BASE_URL != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A repository variable can move the scheduled check to renamed tenants
      # without changing this workflow. Manual runs can override it per run.
      ACCEPTANCE_TENANTS: ${{ inputs.tenant_slugs || vars.ACCEPTANCE_TENANTS || 'opax' }}
      # The site to check. A fork that has not deployed anything sets no
      # CORPUSKIT_BASE_URL, and the job below skips rather than checking
      # somebody else's production and failing every three hours.
      ACCEPTANCE_BASE_URL: ${{ vars.CORPUSKIT_BASE_URL || 'https://corpuskit.org' }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Sweep live tenants
        run: deno run --allow-net --allow-env=ACCEPTANCE_TENANTS,ACCEPTANCE_BASE_URL apps/api/scripts/live-acceptance.ts
